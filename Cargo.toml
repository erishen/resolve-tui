[package]
name = "resolve-tui"
version = "0.1.0"
edition = "2024"

[features]
default = ["tui", "codegen"]
# TUI 终端界面：ratatui/crossterm 编译较重，纯 CLI / 库嵌入场景可关掉加速构建。
tui = ["dep:ratatui", "dep:crossterm"]
# 运行时代码生成：rhai 沙箱 + 安全正则。关闭后 fastpath 与普通 agent 循环仍可用。
codegen = ["dep:rhai", "dep:regex", "dep:libc"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "time", "sync", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dotenvy = "0.15"
futures = "0.3"
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", features = ["event-stream"], optional = true }
chrono = "0.4"
toml = "0.8"
dirs = "5"
base64 = "0.22"
keyring = "3"
rhai = { version = "1", features = ["sync"], optional = true }
regex = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
