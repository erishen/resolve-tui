# resolve-tui CI: fmt / clippy / test / feature matrix.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: fmt + clippy + test (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (default features, warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  features:
    name: feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check four feature combinations
        run: |
          set -e
          cargo check --all-targets
          cargo check --all-targets --no-default-features
          cargo check --no-default-features --features tui
          cargo check --no-default-features --features codegen
